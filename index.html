<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHSE Monitoring - SMK ICB Cinta Wisata</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk Interaksi -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* CSS Khusus Cetak / Print */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                padding: 10px;
            }
            .no-print {
                display: none !important;
            }
            /* Menampilkan mode tabel saat cetak */
            .print-table {
                display: table !important;
                width: 100% !important;
                border-collapse: collapse !important;
            }
            .print-table th, .print-table td {
                border: 1px solid #cbd5e1 !important;
                padding: 8px !important;
                font-size: 11px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex justify-center items-center min-h-screen p-0 sm:p-4" x-data="app()">

    <!-- CONTAINER UTAMA -->
    <div class="w-full h-screen sm:h-[88vh] sm:max-w-3xl bg-white shadow-none sm:shadow-2xl rounded-none sm:rounded-2xl flex flex-col relative overflow-hidden">

        <!-- MODAL FULL VIEW GAMBAR -->
        <template x-if="showModalImage">
            <div class="absolute inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-4" @click="showModalImage = false">
                <div class="relative max-w-full max-h-full">
                    <img :src="activeImage" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
                    <p class="text-white text-xs text-center mt-4">Ketuk di mana saja untuk menutup</p>
                </div>
            </div>
        </template>

        <!-- LOADING OVERLAY -->
        <template x-if="loading">
            <div class="absolute inset-0 bg-black/50 z-50 flex items-center justify-center">
                <div class="bg-white p-4 rounded-xl shadow-lg text-xs font-semibold text-blue-900 flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-blue-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span x-text="loadingText"></span>
                </div>
            </div>
        </template>

        <!-- ================= PAGE: LOGIN ================= -->
        <template x-if="page === 'login'">
            <div class="flex-1 flex flex-col justify-center px-6 py-12 bg-gradient-to-b from-blue-900 to-indigo-900 text-white overflow-y-auto">
                <div class="text-center mb-6 mt-4">
                    <div class="w-24 h-24 mx-auto mb-3 bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-indigo-400 overflow-hidden">
                        <img src="https://i.ibb.co.com/DHmRPRpZ/logo-chse.jpg" alt="Logo CHSE SMK ICB Cinta Wisata" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&w=200&q=80'">
                    </div>
                    <h1 class="text-xl font-bold tracking-wide">CHSE MONITORING</h1>
                    <p class="text-xs text-indigo-200 mt-1">SMK ICB Cinta Wisata</p>
                </div>

                <div class="bg-white/10 backdrop-blur-md p-5 rounded-2xl border border-white/20 shadow-xl max-w-sm mx-auto w-full">
                    <form @submit.prevent="login()" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200 mb-1">Username</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-3 py-2.5 text-sm rounded-xl bg-white/20 border border-white/30 text-white placeholder-indigo-300 focus:outline-none" placeholder="Username...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200 mb-1">Password</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2.5 text-sm rounded-xl bg-white/20 border border-white/30 text-white placeholder-indigo-300 focus:outline-none" placeholder="Password...">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-white text-blue-900 font-bold text-sm rounded-xl shadow-lg hover:bg-indigo-50 transition active:scale-95">
                            MASUK APLIKASI
                        </button>
                    </form>
                    <p class="text-xs text-center text-red-300 mt-3" x-text="loginError"></p>
                </div>
            </div>
        </template>

        <!-- ================= PAGE: DASHBOARD (USER & ADMIN) ================= -->
        <template x-if="page === 'dashboard'">
            <div class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
                <!-- Header App -->
                <header class="bg-blue-900 text-white px-4 py-3 sm:px-6 sm:py-4 flex justify-between items-center shadow-md no-print">
                    <div>
                        <h2 class="font-bold text-sm sm:text-base" x-text="role === 'admin' ? 'Admin CHSE' : 'User CHSE'"></h2>
                        <p class="text-[10px] sm:text-xs text-indigo-200">SMK ICB Cinta Wisata (<span class="font-semibold text-white" x-text="currentUser"></span>)</p>
                    </div>
                    <button @click="logout()" class="text-xs sm:text-sm bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg font-medium transition">
                        Keluar
                    </button>
                </header>

                <!-- Navigation Tabs -->
                <div class="flex border-b border-slate-200 bg-white text-xs sm:text-sm no-print">
                    <button @click="activeTab = 'list'" :class="activeTab === 'list' ? 'border-b-2 border-blue-900 text-blue-900 font-bold' : 'text-slate-500'" class="flex-1 py-3 text-center transition">
                        Laporan (<span x-text="reports.length"></span>)
                    </button>
                    <button @click="activeTab = 'add'" :class="activeTab === 'add' ? 'border-b-2 border-blue-900 text-blue-900 font-bold' : 'text-slate-500'" class="flex-1 py-3 text-center transition">
                        + Buat Laporan
                    </button>
                    <template x-if="role === 'admin'">
                        <button @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'border-b-2 border-blue-900 text-blue-900 font-bold' : 'text-slate-500'" class="flex-1 py-3 text-center transition">
                            Pengaturan
                        </button>
                    </template>
                </div>

                <!-- Content Area -->
                <div class="flex-1 p-3 sm:p-6 overflow-y-auto space-y-3" id="printable-area">
                    
                    <!-- AREA HANYA MUNCUL SAAT CETAK / PRINT -->
                    <div class="hidden print:block mb-4 pb-2 border-b">
                        <h1 class="text-lg font-bold text-slate-900 uppercase">REKAP LAPORAN MONITORING AREA CHSE</h1>
                        <p class="text-xs text-slate-600">SMK ICB Cinta Wisata Bandung</p>
                        <p class="text-xs text-slate-500">Tanggal Cetak: <span x-text="getWIBDateStr()"></span></p>
                    </div>

                    <!-- TABEL KHUSUS MODEL FORMAT CETAK REKAP LAPORAN -->
                    <table class="hidden print-table w-full text-left border-collapse border border-slate-300 my-2">
                        <thead>
                            <tr class="bg-slate-100 uppercase text-[10px] font-bold text-slate-700">
                                <th class="border border-slate-300 p-2">No</th>
                                <th class="border border-slate-300 p-2">Tanggal & Waktu</th>
                                <th class="border border-slate-300 p-2">Pelapor</th>
                                <th class="border border-slate-300 p-2">Area / Lokasi</th>
                                <th class="border border-slate-300 p-2">Keterangan</th>
                                <th class="border border-slate-300 p-2">Status</th>
                                <th class="border border-slate-300 p-2">Tindak Lanjut Admin</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(rpt, rIdx) in (selectedPrintReport ? [selectedPrintReport] : reports)" :key="rIdx">
                                <tr>
                                    <td class="border border-slate-300 p-2 text-center" x-text="rIdx + 1"></td>
                                    <td class="border border-slate-300 p-2" x-text="rpt.date"></td>
                                    <td class="border border-slate-300 p-2 font-bold" x-text="rpt.username || rpt.pelapor || currentUser"></td>
                                    <td class="border border-slate-300 p-2" x-text="rpt.area"></td>
                                    <td class="border border-slate-300 p-2" x-text="rpt.keterangan"></td>
                                    <td class="border border-slate-300 p-2 text-center font-bold" x-text="rpt.status"></td>
                                    <td class="border border-slate-300 p-2" x-text="rpt.tindakLanjut || '-'"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                    <!-- TAB 1: DAFTAR LAPORAN (TAMPILAN MONITOR) -->
                    <div x-show="activeTab === 'list'" class="space-y-3 pb-6 max-w-2xl mx-auto w-full no-print">
                        
                        <!-- TOMBOL CETAK SELURUH REKAP LAPORAN -->
                        <div class="flex justify-between items-center bg-blue-50 p-3 rounded-xl border border-blue-100">
                            <div>
                                <h4 class="font-bold text-xs text-blue-900">Rekap Laporan Utuh</h4>
                                <p class="text-[10px] text-blue-700">Cetak seluruh data laporan dalam bentuk tabel rekapitulasi.</p>
                            </div>
                            <button @click="printAll()" class="px-3 py-2 bg-blue-900 hover:bg-blue-800 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                Cetak Semua Rekap
                            </button>
                        </div>

                        <template x-for="(item, index) in reports" :key="index">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                <div class="flex justify-between items-start">
                                    <div class="space-y-1.5">
                                        <!-- Tampilan Area & Username Pelapor -->
                                        <div class="flex flex-wrap items-center gap-1.5">
                                            <span class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full border border-blue-100" x-text="'📍 ' + item.area"></span>
                                            <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-700 rounded-full border border-slate-200" x-text="'👤 Pelapor: ' + (item.username || item.pelapor || currentUser)"></span>
                                        </div>
                                        <div class="text-xs text-slate-400">
                                            Waktu: <span x-text="item.date"></span>
                                        </div>
                                    </div>
                                    <span class="text-xs font-bold px-2.5 py-1 rounded" :class="item.status === 'Selesai' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'" x-text="item.status"></span>
                                </div>
                                
                                <div>
                                    <p class="text-xs font-semibold text-slate-400 uppercase">Keterangan:</p>
                                    <p class="text-sm text-slate-700 mt-0.5" x-text="item.keterangan"></p>
                                </div>

                                <!-- Galeri Foto Laporan -->
                                <template x-if="getImagesArray(item.foto).length > 0">
                                    <div>
                                        <p class="text-xs font-medium text-slate-400 mb-1">Foto Laporan (ketuk untuk memperbesar):</p>
                                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                            <template x-for="(imgSrc, imgIndex) in getImagesArray(item.foto)" :key="imgIndex">
                                                <img :src="imgSrc" @click="openFullImage(imgSrc)" class="w-full h-28 object-cover rounded-lg border border-slate-200 cursor-pointer hover:opacity-95 transition">
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <!-- Tindak Lanjut Section -->
                                <div class="border-t border-slate-100 pt-3 mt-2">
                                    <template x-if="item.tindakLanjut">
                                        <div class="space-y-1.5 bg-slate-50 p-3 rounded-lg text-xs sm:text-sm">
                                            <p class="font-bold text-indigo-900">Tindak Lanjut Admin:</p>
                                            <p class="text-slate-600" x-text="item.tindakLanjut"></p>
                                            <template x-if="getImagesArray(item.dokTindakLanjut).length > 0">
                                                <div>
                                                    <p class="text-xs font-medium text-slate-400 mt-1.5">Dokumentasi Tindak Lanjut (ketuk untuk memperbesar):</p>
                                                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-1">
                                                        <template x-for="(imgSrc, imgIndex) in getImagesArray(item.dokTindakLanjut)" :key="imgIndex">
                                                            <img :src="imgSrc" @click="openFullImage(imgSrc)" class="w-full h-24 object-cover rounded border cursor-pointer hover:opacity-95 transition">
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Form Tindak Lanjut Khusus Admin -->
                                    <template x-if="role === 'admin' && !item.tindakLanjut">
                                        <div class="space-y-2.5 bg-blue-50/60 p-3 rounded-lg border border-blue-100 text-xs sm:text-sm no-print" x-data="{ tindakText: '', imageBase64List: [], tempPreviews: [] }">
                                            <p class="font-bold text-blue-900">Tambah Tindak Lanjut :</p>
                                            <textarea x-model="tindakText" placeholder="Tulis tindakan..." rows="2" class="w-full p-2.5 bg-white border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none"></textarea>
                                            
                                            <div>
                                                <label class="block font-semibold text-blue-900 mb-1">Upload Gambar / Dokumentasi (Bisa pilih beberapa):</label>
                                                <input type="file" multiple @change="(e) => handleMultipleFiles(e, (base64Array) => { imageBase64List = base64Array; tempPreviews = base64Array; })" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-100 file:text-blue-700">
                                                <template x-if="tempPreviews.length > 0">
                                                    <div class="grid grid-cols-3 gap-2 mt-2">
                                                        <template x-for="(prev, pIdx) in tempPreviews" :key="pIdx">
                                                            <img :src="prev" class="w-full h-20 object-cover rounded border">
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>

                                            <button @click="submitTindakLanjutDirect(item, tindakText, JSON.stringify(imageBase64List))" class="w-full py-2 bg-blue-900 text-white rounded-lg font-bold shadow hover:bg-blue-800 transition">
                                                Simpan Tindak Lanjut
                                            </button>
                                        </div>
                                    </template>
                                </div>

                                <!-- Tombol Aksi Cetak Per Baris -->
                                <div class="pt-2 flex gap-2 no-print">
                                    <button @click="printSingle(item)" class="flex-1 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs sm:text-sm font-medium transition flex items-center justify-center gap-1.5">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                        Cetak Laporan Ini
                                    </button>
                                    <template x-if="role === 'admin'">
                                        <button @click="deleteReport(item)" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs sm:text-sm font-medium transition">
                                            Hapus
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template x-if="reports.length === 0">
                            <p class="text-center text-xs text-slate-400 py-10">Belum ada laporan.</p>
                        </template>
                    </div>

                    <!-- TAB 2: TAMBAH LAPORAN -->
                    <div x-show="activeTab === 'add'" class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-3 pb-6 max-w-xl mx-auto w-full no-print">
                        <h3 class="font-bold text-sm sm:text-base text-slate-800 border-b pb-2">Form Laporan Area CHSE</h3>
                        <form @submit.prevent="submitReportDirect()" class="space-y-4 text-xs sm:text-sm">
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Pelapor (Otomatis dari Akun Active):</label>
                                <!-- Field Pelapor Terkunci ke Akun yang Sedang Login -->
                                <input type="text" :value="currentUser" disabled class="w-full p-3 bg-slate-100 font-bold border border-slate-200 rounded-lg text-slate-700 cursor-not-allowed">
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Area / Lokasi :</label>
                                <input type="text" x-model="newReport.area" required placeholder="Contoh: Toilet Lantai 2 / Kantin..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900">
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Keterangan :</label>
                                <textarea x-model="newReport.keterangan" required rows="3" placeholder="Deskripsikan kondisi..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none"></textarea>
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Upload Foto (Bisa pilih beberapa foto sekaligus):</label>
                                <input type="file" multiple @change="(e) => handleMultipleFiles(e, (base64Array) => { newReport.imagesBase64 = base64Array; newReport.previews = base64Array; })" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 border border-slate-200 rounded-lg p-1.5 bg-slate-50">
                                
                                <template x-if="newReport.previews.length > 0">
                                    <div class="grid grid-cols-3 gap-2 mt-3">
                                        <template x-for="(prev, pIdx) in newReport.previews" :key="pIdx">
                                            <img :src="prev" @click="openFullImage(prev)" class="w-full h-24 object-cover rounded-lg border cursor-pointer">
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <button type="submit" class="w-full py-3 bg-blue-900 text-white rounded-lg font-bold shadow hover:bg-blue-800 transition">
                                Kirim Laporan
                            </button>
                        </form>
                    </div>

                    <!-- TAB 3: PENGATURAN ADMIN -->
                    <template x-if="role === 'admin'">
                        <div x-show="activeTab === 'settings'" class="space-y-3 pb-6 max-w-xl mx-auto w-full text-xs sm:text-sm no-print">
                            <div class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                <h3 class="font-bold text-slate-800 border-b pb-2">Pengaturan Admin</h3>
                                <div class="space-y-2">
                                    <button @click="settingsView = 'addUser'" class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-slate-100 rounded-lg font-medium flex justify-between items-center transition">
                                        <span>Tambah Akun Baru</span>
                                        <span>&rarr;</span>
                                    </button>
                                    <button @click="settingsView = 'changePass'" class="w-full text-left px-4 py-3 bg-slate-50 hover:bg-slate-100 rounded-lg font-medium flex justify-between items-center transition">
                                        <span>Ganti Password Akun</span>
                                        <span>&rarr;</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Form Tambah Akun -->
                            <div x-show="settingsView === 'addUser'" class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <h4 class="font-bold text-blue-900">Tambah Akun Baru</h4>
                                    <button @click="settingsView = ''" class="text-slate-400">Tutup</button>
                                </div>
                                <form @submit.prevent="addUser()" class="space-y-3">
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Username</label>
                                        <input type="text" x-model="formNewUser.username" required class="w-full p-2.5 bg-slate-50 border rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Password</label>
                                        <input type="password" x-model="formNewUser.password" required class="w-full p-2.5 bg-slate-50 border rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Role</label>
                                        <select x-model="formNewUser.role" class="w-full p-2.5 bg-slate-50 border rounded-lg">
                                            <option value="user">User</option>
                                            <option value="admin">Admin</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Verifikasi PIN Keamanan</label>
                                        <input type="password" x-model="enteredPin" maxlength="6" placeholder="Masukkan PIN verifikasi" required class="w-full p-2.5 bg-slate-50 border rounded-lg text-center tracking-widest">
                                    </div>
                                    <button type="submit" class="w-full py-2.5 bg-blue-900 text-white rounded-lg font-bold shadow">Simpan</button>
                                </form>
                            </div>

                            <!-- Form Ganti Password -->
                            <div x-show="settingsView === 'changePass'" class="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-200 space-y-3">
                                <div class="flex justify-between items-center border-b pb-2">
                                    <h4 class="font-bold text-blue-900">Ganti Password</h4>
                                    <button @click="settingsView = ''" class="text-slate-400">Tutup</button>
                                </div>
                                <form @submit.prevent="changePassword()" class="space-y-3">
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Pilih User</label>
                                        <select x-model="formChangePass.username" class="w-full p-2.5 bg-slate-50 border rounded-lg">
                                            <template x-for="acc in accounts">
                                                <option :value="acc.username" x-text="acc.username"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Password Baru</label>
                                        <input type="password" x-model="formChangePass.newPassword" required class="w-full p-2.5 bg-slate-50 border rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500 mb-1">Verifikasi PIN Keamanan</label>
                                        <input type="password" x-model="enteredPin" maxlength="6" placeholder="Masukkan PIN verifikasi" required class="w-full p-2.5 bg-slate-50 border rounded-lg text-center tracking-widest">
                                    </div>
                                    <button type="submit" class="w-full py-2.5 bg-blue-900 text-white rounded-lg font-bold shadow">Update Password</button>
                                </form>
                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </template>

    </div>

    <!-- Script Utama -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZY_54xQw40t00fIFNTOfEj0n6TStGT3z1rwy9Or0pxmBpewv6mcRsPkM6APKbveBb/exec';

        // Fungsi kompresi gambar tunggal
        function processImageNormal(file, callback, maxWidth = 1280, quality = 0.85) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
            };
        }

        // Fungsi kompresi banyak gambar
        function handleMultipleFiles(e, callback) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            let processed = [];
            let count = 0;

            files.forEach((file, index) => {
                processImageNormal(file, (base64) => {
                    processed[index] = base64;
                    count++;
                    if (count === files.length) {
                        callback(processed);
                    }
                });
            });
        }

        function app() {
            return {
                page: 'login',
                role: '',
                currentUser: '',
                activeTab: 'list',
                settingsView: '',
                loginError: '',
                loading: false,
                loadingText: 'Memproses...',
                showModalImage: false,
                activeImage: '',
                accounts: [],
                reports: [],
                selectedPrintReport: null,
                securityPin: '070707',
                enteredPin: '',
                loginForm: { username: '', password: '' },
                newReport: { area: '', keterangan: '', imagesBase64: [], previews: [] },
                formNewUser: { username: '', password: '', role: 'user' },
                formChangePass: { username: '', newPassword: '' },

                init() {
                    this.fetchData();
                },

                // Mengekstrak array foto dari string JSON atau gambar tunggal
                getImagesArray(photoData) {
                    if (!photoData) return [];
                    try {
                        const parsed = JSON.parse(photoData);
                        return Array.isArray(parsed) ? parsed : [photoData];
                    } catch (e) {
                        return [photoData];
                    }
                },

                getWIBDateStr() {
                    const options = { 
                        timeZone: 'Asia/Jakarta', 
                        day: 'numeric', 
                        month: 'short', 
                        year: 'numeric', 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: false
                    };
                    return new Intl.DateTimeFormat('id-ID', options).format(new Date()) + ' WIB';
                },

                fetchData() {
                    fetch(SCRIPT_URL + '?action=getAccounts')
                        .then(res => res.json())
                        .then(data => { this.accounts = data; })
                        .catch(err => console.error('Gagal memuat akun:', err));

                    fetch(SCRIPT_URL + '?action=getReports')
                        .then(res => res.json())
                        .then(data => { this.reports = data.reverse(); })
                        .catch(err => console.error('Gagal memuat laporan:', err));
                },

                login() {
                    this.loginError = '';
                    let found = this.accounts.find(acc => acc.username === this.loginForm.username && acc.password === this.loginForm.password);
                    if (found) {
                        this.role = found.role;
                        this.currentUser = found.username;
                        this.page = 'dashboard';
                        this.activeTab = 'list';
                        this.loginForm = { username: '', password: '' };
                        this.fetchData();
                    } else {
                        this.loginError = 'Username atau password salah!';
                    }
                },

                logout() {
                    this.page = 'login';
                    this.role = '';
                    this.currentUser = '';
                    this.loginError = '';
                },

                openFullImage(imgSrc) {
                    this.activeImage = imgSrc;
                    this.showModalImage = true;
                },

                async submitReportDirect() {
                    if(!this.newReport.area || !this.newReport.keterangan) return;
                    this.loading = true;
                    this.loadingText = 'Menyimpan laporan...';

                    // Mengirimkan currentUser sebagai pelapor secara otomatis
                    const payload = {
                        action: 'addReport',
                        id: 'REP-' + Date.now(),
                        username: this.currentUser,
                        pelapor: this.currentUser,
                        date: this.getWIBDateStr(),
                        area: this.newReport.area,
                        keterangan: this.newReport.keterangan,
                        foto: JSON.stringify(this.newReport.imagesBase64 || []),
                        status: 'Pending',
                        tindakLanjut: '',
                        dokTindakLanjut: ''
                    };

                    try {
                        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                        this.loading = false;
                        this.newReport = { area: '', keterangan: '', imagesBase64: [], previews: [] };
                        this.activeTab = 'list';
                        this.fetchData();
                    } catch (err) {
                        this.loading = false;
                        alert('Gagal mengirim laporan!');
                    }
                },

                async submitTindakLanjutDirect(item, text, imageBase64Data) {
                    if(!text) return;
                    this.loading = true;
                    this.loadingText = 'Menyimpan tindak lanjut...';

                    const payload = {
                        action: 'updateReport',
                        id: item.id,
                        status: 'Selesai',
                        tindakLanjut: text,
                        dokTindakLanjut: imageBase64Data || ''
                    };

                    try {
                        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                        this.loading = false;
                        this.fetchData();
                    } catch (err) {
                        this.loading = false;
                        alert('Gagal menyimpan tindak lanjut!');
                    }
                },

                deleteReport(item) {
                    if(confirm('Apakah Anda yakin ingin menghapus laporan ini?')) {
                        this.loading = true;
                        this.loadingText = 'Menghapus laporan...';
                        fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deleteReport', id: item.id })
                        })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            this.fetchData();
                        })
                        .catch(err => {
                            this.loading = false;
                            alert('Gagal menghapus laporan!');
                        });
                    }
                },

                printSingle(item) {
                    this.selectedPrintReport = item;
                    setTimeout(() => {
                        window.print();
                        this.selectedPrintReport = null;
                    }, 200);
                },

                printAll() {
                    this.selectedPrintReport = null;
                    setTimeout(() => {
                        window.print();
                    }, 200);
                },

                addUser() {
                    if(this.enteredPin !== this.securityPin) {
                        alert('PIN Verifikasi salah!');
                        return;
                    }
                    this.loading = true;
                    this.loadingText = 'Menambahkan akun...';
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'addAccount', ...this.formNewUser })
                    })
                    .then(res => res.json())
                    .then(res => {
                        this.loading = false;
                        alert('Akun berhasil ditambahkan!');
                        this.formNewUser = { username: '', password: '', role: 'user' };
                        this.enteredPin = '';
                        this.settingsView = '';
                        this.fetchData();
                    })
                    .catch(err => {
                        this.loading = false;
                        alert('Gagal menambah akun!');
                    });
                },

                changePassword() {
                    if(this.enteredPin !== this.securityPin) {
                        alert('PIN Verifikasi salah!');
                        return;
                    }
                    this.loading = true;
                    this.loadingText = 'Mengubah password...';
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'changePassword', ...this.formChangePass })
                    })
                    .then(res => res.json())
                    .then(res => {
                        this.loading = false;
                        alert('Password berhasil diubah!');
                        this.formChangePass = { username: '', newPassword: '' };
                        this.enteredPin = '';
                        this.settingsView = '';
                        this.fetchData();
                    })
                    .catch(err => {
                        this.loading = false;
                        alert('Gagal mengubah password!');
                    });
                }
            }
        }
    </script>
</body>
</html>
