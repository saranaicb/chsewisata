<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHSE Monitoring - SMK ICB Cinta Wisata</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js untuk Interaksi -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Style khusus untuk cetak tanpa kop surat */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white !important;
                padding: 20px;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex justify-center items-center min-h-screen p-4" x-data="app()">

    <!-- CONTAINER UTAMA (Smartphone Simulator Frame) -->
    <div class="w-full max-w-sm h-[780px] bg-white shadow-2xl rounded-3xl flex flex-col relative overflow-hidden border-8 border-slate-800">

        <!-- Notch / Speaker Smartphone Simulator -->
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-5 bg-slate-800 rounded-b-xl z-50 no-print"></div>

        <!-- MODAL FULL VIEW GAMBAR -->
        <template x-if="showModalImage">
            <div class="absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-4" @click="showModalImage = false">
                <div class="relative max-w-full max-h-full">
                    <img :src="activeImage" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl">
                    <p class="text-white text-xs text-center mt-4">Ketuk di mana saja untuk menutup</p>
                </div>
            </div>
        </template>

        <!-- LOADING OVERLAY -->
        <template x-if="loading">
            <div class="absolute inset-0 bg-black/50 z-50 flex items-center justify-center">
                <div class="bg-white p-4 rounded-xl shadow-lg text-xs font-semibold text-blue-900 flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-blue-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span x-text="loadingText"></span>
                </div>
            </div>
        </template>

        <!-- ================= PAGE: LOGIN ================= -->
        <template x-if="page === 'login'">
            <div class="flex-1 flex flex-col justify-center px-6 py-12 bg-gradient-to-b from-blue-900 to-indigo-900 text-white overflow-y-auto">
                <div class="text-center mb-6 mt-4">
                    <!-- Logo CHSE SMK ICB Cinta Wisata -->
                    <div class="w-24 h-24 mx-auto mb-3 bg-white rounded-full flex items-center justify-center shadow-lg border-4 border-indigo-400 overflow-hidden">
                        <img src="https://i.ibb.co.com/DHmRPRpZ/logo-chse.jpg" alt="Logo CHSE SMK ICB Cinta Wisata" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?auto=format&fit=crop&w=200&q=80'">
                    </div>
                    <h1 class="text-xl font-bold tracking-wide">CHSE MONITORING</h1>
                    <p class="text-xs text-indigo-200 mt-1">SMK ICB Cinta Wisata</p>
                </div>

                <div class="bg-white/10 backdrop-blur-md p-5 rounded-2xl border border-white/20 shadow-xl">
                    <form @submit.prevent="login()" class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200 mb-1">Username</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-3 py-2.5 text-sm rounded-xl bg-white/20 border border-white/30 text-white placeholder-indigo-300 focus:outline-none" placeholder="Username...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-200 mb-1">Password</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-3 py-2.5 text-sm rounded-xl bg-white/20 border border-white/30 text-white placeholder-indigo-300 focus:outline-none" placeholder="Password...">
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-white text-blue-900 font-bold text-sm rounded-xl shadow-lg hover:bg-indigo-50 transition active:scale-95">
                            MASUK APLIKASI
                        </button>
                    </form>
                    <p class="text-xs text-center text-red-300 mt-3" x-text="loginError"></p>
                </div>
            </div>
        </template>

        <!-- ================= PAGE: DASHBOARD (USER & ADMIN) ================= -->
        <template x-if="page === 'dashboard'">
            <div class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
                <!-- Header App -->
                <header class="bg-blue-900 text-white px-4 py-3 pt-6 flex justify-between items-center shadow-md no-print">
                    <div>
                        <h2 class="font-bold text-sm" x-text="role === 'admin' ? 'Admin CHSE' : 'User CHSE'"></h2>
                        <p class="text-[10px] text-indigo-200">SMK ICB Cinta Wisata (<span class="font-semibold text-white" x-text="currentUser"></span>)</p>
                    </div>
                    <button @click="logout()" class="text-xs bg-red-500 hover:bg-red-600 px-2.5 py-1 rounded-lg font-medium transition">
                        Keluar
                    </button>
                </header>

                <!-- Navigation Tabs -->
                <div class="flex border-b border-slate-200 bg-white text-xs no-print">
                    <button @click="activeTab = 'list'" :class="activeTab === 'list' ? 'border-b-2 border-blue-900 text-blue-900 font-bold' : 'text-slate-500'" class="flex-1 py-2.5 text-center transition">
                        Laporan (<span x-text="reports.length"></span>)
                    </button>
                    <button @click="activeTab = 'add'" :class="activeTab === 'add' ? 'border-b-2 border-blue-900 text-blue-900 font-bold' : 'text-slate-500'" class="flex-1 py-2.5 text-center transition">
                        + Buat Laporan
                    </button>
                    <template x-if="role === 'admin'">
                        <button @click="activeTab = 'settings'" :class="activeTab === 'settings' ? 'border-b-2 border-blue-900 text-blue-900 font-bold' : 'text-slate-500'" class="flex-1 py-2.5 text-center transition">
                            Pengaturan
                        </button>
                    </template>
                </div>

                <!-- Content Area -->
                <div class="flex-1 p-3 overflow-y-auto space-y-3" id="printable-area">
                    
                    <!-- Judul Khusus Cetak (Tanpa Kop Surat) -->
                    <div class="hidden print:block mb-4 border-b pb-2">
                        <h1 class="text-base font-bold text-slate-900">REKAP LAPORAN MONITORING AREA CHSE</h1>
                        <p class="text-xs text-slate-500">Tanggal Cetak: <span x-text="getWIBDateStr()"></span></p>
                    </div>

                    <!-- TAB 1: DAFTAR LAPORAN -->
                    <div x-show="activeTab === 'list'" class="space-y-3 pb-6">
                        <template x-for="(item, index) in reports" :key="index">
                            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 space-y-2">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class="text-[10px] font-semibold px-2 py-0.5 bg-blue-50 text-blue-700 rounded-full" x-text="item.area"></span>
                                        <div class="text-[10px] text-slate-400 mt-1">
                                            Oleh: <span class="font-bold text-slate-700" x-text="item.username || 'Sistem'"></span> | <span x-text="item.date"></span>
                                        </div>
                                    </div>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded" :class="item.status === 'Selesai' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'" x-text="item.status"></span>
                                </div>
                                
                                <div>
                                    <p class="text-[10px] font-semibold text-slate-400 uppercase">Keterangan:</p>
                                    <p class="text-xs text-slate-700 mt-0.5" x-text="item.keterangan"></p>
                                </div>

                                <!-- Foto Laporan (Bisa diklik untuk Full View) -->
                                <template x-if="item.foto">
                                    <div>
                                        <p class="text-[9px] font-medium text-slate-400 mb-1">Foto Laporan (ketuk untuk memperbesar):</p>
                                        <img :src="item.foto" @click="openFullImage(item.foto)" class="w-full h-24 object-cover rounded-lg border border-slate-100 cursor-pointer hover:opacity-90 transition" loading="lazy">
                                    </div>
                                </template>

                                <!-- Tindak Lanjut Section -->
                                <div class="border-t border-slate-100 pt-2 mt-1">
                                    <template x-if="item.tindakLanjut">
                                        <div class="space-y-1 bg-slate-50 p-2 rounded-lg text-xs">
                                            <p class="font-bold text-indigo-900">Tindak Lanjut Admin:</p>
                                            <p class="text-slate-600" x-text="item.tindakLanjut"></p>
                                            <template x-if="item.dokTindakLanjut">
                                                <div>
                                                    <p class="text-[9px] font-medium text-slate-400 mt-1">Dokumentasi Tindak Lanjut (ketuk untuk memperbesar):</p>
                                                    <img :src="item.dokTindakLanjut" @click="openFullImage(item.dokTindakLanjut)" class="w-full h-20 object-cover rounded mt-1 cursor-pointer hover:opacity-90 transition" loading="lazy">
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Form Tindak Lanjut & Upload Gambar (Khusus Admin jika belum ada) -->
                                    <template x-if="role === 'admin' && !item.tindakLanjut">
                                        <div class="space-y-2 bg-blue-50/60 p-2.5 rounded-lg border border-blue-100 text-xs no-print" x-data="{ tindakText: '', rawFile: null, tempPreview: '' }">
                                            <p class="font-bold text-blue-900">Tambah Tindak Lanjut :</p>
                                            <textarea x-model="tindakText" placeholder="Tulis tindakan..." rows="2" class="w-full p-2 bg-white border border-slate-200 rounded text-xs focus:outline-none"></textarea>
                                            
                                            <div>
                                                <label class="block font-semibold text-blue-900 mb-1">Upload Gambar / Dokumentasi :</label>
                                                <input type="file" @change="async (e) => {
                                                    const f = e.target.files[0];
                                                    if(f) {
                                                        rawFile = await compressImage(f);
                                                        tempPreview = URL.createObjectURL(rawFile);
                                                    }
                                                }" accept="image/*" class="w-full text-[10px] text-slate-500 file:mr-1 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-blue-100 file:text-blue-700">
                                                <template x-if="tempPreview">
                                                    <img :src="tempPreview" class="mt-1 w-full h-20 object-cover rounded border">
                                                </template>
                                            </div>

                                            <button @click="submitTindakLanjutWithImage(item, tindakText, rawFile)" class="w-full py-1.5 bg-blue-900 text-white rounded font-bold shadow hover:bg-blue-800 transition">
                                                Simpan Tindak Lanjut
                                            </button>
                                        </div>
                                    </template>
                                </div>

                                <!-- Tombol Aksi (Save & Cetak + Hapus khusus Admin) -->
                                <div class="pt-2 flex gap-2 no-print">
                                    <button @click="saveAndPrint(item)" class="flex-1 py-1.5 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-[11px] font-medium transition flex items-center justify-center gap-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                        Save & Cetak
                                    </button>
                                    <template x-if="role === 'admin'">
                                        <button @click="deleteReport(item)" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-[11px] font-medium transition">
                                            Hapus
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template x-if="reports.length === 0">
                            <p class="text-center text-xs text-slate-400 py-10">Belum ada laporan.</p>
                        </template>
                    </div>

                    <!-- TAB 2: TAMBAH LAPORAN (USER FORMAT - AREA KETIK MANUAL) -->
                    <div x-show="activeTab === 'add'" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3 pb-6 no-print">
                        <h3 class="font-bold text-xs text-slate-800 border-b pb-1">Form Laporan Area CHSE</h3>
                        <form @submit.prevent="submitReport()" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Area :</label>
                                <input type="text" x-model="newReport.area" required placeholder="Contoh: Toilet Lantai 2 / Kantin..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900">
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Keterangan :</label>
                                <textarea x-model="newReport.keterangan" required rows="3" placeholder="Deskripsikan kondisi..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none"></textarea>
                            </div>
                            <div>
                                <label class="block font-semibold uppercase text-slate-500 mb-1">Upload Foto :</label>
                                <input type="file" @change="async (e) => { 
                                    const f = e.target.files[0];
                                    if(f) {
                                        newReport.rawFile = await compressImage(f);
                                        newReport.preview = URL.createObjectURL(newReport.rawFile);
                                    }
                                }" accept="image/*" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-blue-50 file:text-blue-700 border border-slate-200 rounded-lg p-1 bg-slate-50">
                                <template x-if="newReport.preview">
                                    <img :src="newReport.preview" @click="openFullImage(newReport.preview)" class="mt-2 w-full h-24 object-cover rounded-lg border cursor-pointer">
                                </template>
                            </div>
                            <button type="submit" class="w-full py-2.5 bg-blue-900 text-white rounded-lg font-bold shadow hover:bg-blue-800 transition">
                                Kirim Laporan
                            </button>
                        </form>
                    </div>

                    <!-- TAB 3: PENGATURAN ADMIN -->
                    <template x-if="role === 'admin'">
                        <div x-show="activeTab === 'settings'" class="space-y-3 pb-6 text-xs no-print">
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                                <h3 class="font-bold text-slate-800 border-b pb-1">Pengaturan Admin</h3>
                                <div class="space-y-2">
                                    <button @click="settingsView = 'addUser'" class="w-full text-left px-3 py-2.5 bg-slate-50 hover:bg-slate-100 rounded-lg font-medium flex justify-between items-center transition">
                                        <span>Tambah Akun Baru</span>
                                        <span>&rarr;</span>
                                    </button>
                                    <button @click="settingsView = 'changePass'" class="w-full text-left px-3 py-2.5 bg-slate-50 hover:bg-slate-100 rounded-lg font-medium flex justify-between items-center transition">
                                        <span>Ganti Password Akun</span>
                                        <span>&rarr;</span>
                                    </button>
                                </div>
                            </div>

                            <!-- Form Tambah Akun (PIN tersembunyi total tanpa hint) -->
                            <div x-show="settingsView === 'addUser'" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                                <div class="flex justify-between items-center border-b pb-1">
                                    <h4 class="font-bold text-blue-900">Tambah Akun Baru</h4>
                                    <button @click="settingsView = ''" class="text-slate-400">Tutup</button>
                                </div>
                                <form @submit.prevent="addUser()" class="space-y-2">
                                    <div>
                                        <label class="block font-semibold text-slate-500">Username</label>
                                        <input type="text" x-model="formNewUser.username" required class="w-full p-2 bg-slate-50 border rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500">Password</label>
                                        <input type="password" x-model="formNewUser.password" required class="w-full p-2 bg-slate-50 border rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500">Role</label>
                                        <select x-model="formNewUser.role" class="w-full p-2 bg-slate-50 border rounded-lg">
                                            <option value="user">User</option>
                                            <option value="admin">Admin</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500">Verifikasi PIN Keamanan</label>
                                        <input type="password" x-model="enteredPin" maxlength="6" placeholder="Masukkan PIN verifikasi" required class="w-full p-2 bg-slate-50 border rounded-lg text-center tracking-widest">
                                    </div>
                                    <button type="submit" class="w-full py-2 bg-blue-900 text-white rounded-lg font-bold shadow">Simpan</button>
                                </form>
                            </div>

                            <!-- Form Ganti Password (PIN tersembunyi total tanpa hint) -->
                            <div x-show="settingsView === 'changePass'" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                                <div class="flex justify-between items-center border-b pb-1">
                                    <h4 class="font-bold text-blue-900">Ganti Password</h4>
                                    <button @click="settingsView = ''" class="text-slate-400">Tutup</button>
                                </div>
                                <form @submit.prevent="changePassword()" class="space-y-2">
                                    <div>
                                        <label class="block font-semibold text-slate-500">Pilih User</label>
                                        <select x-model="formChangePass.username" class="w-full p-2 bg-slate-50 border rounded-lg">
                                            <template x-for="acc in accounts">
                                                <option :value="acc.username" x-text="acc.username"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500">Password Baru</label>
                                        <input type="password" x-model="formChangePass.newPassword" required class="w-full p-2 bg-slate-50 border rounded-lg">
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-500">Verifikasi PIN Keamanan</label>
                                        <input type="password" x-model="enteredPin" maxlength="6" placeholder="Masukkan PIN verifikasi" required class="w-full p-2 bg-slate-50 border rounded-lg text-center tracking-widest">
                                    </div>
                                    <button type="submit" class="w-full py-2 bg-blue-900 text-white rounded-lg font-bold shadow">Update Password</button>
                                </form>
                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </template>

    </div>

    <!-- Script Kompresi & Koneksi Cepat -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZY_54xQw40t00fIFNTOfEj0n6TStGT3z1rwy9Or0pxmBpewv6mcRsPkM6APKbveBb/exec';
        const IMGBB_API_KEY = 'ff6b62f8524e82b7815501fb43d05353';

        // Fungsi Kompresi Gambar Otomatis (Membuat file jadi kecil & ringan tanpa pecah)
        function compressImage(file, maxWidth = 900, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            const compressedFile = new File([blob], file.name, {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        function app() {
            return {
                page: 'login',
                role: '',
                currentUser: '', // Variabel untuk menyimpan username yang aktif login
                activeTab: 'list',
                settingsView: '',
                loginError: '',
                loading: false,
                loadingText: 'Memproses...',
                showModalImage: false,
                activeImage: '',
                accounts: [],
                reports: [],
                securityPin: '070707', // Tersembunyi total tanpa hint
                enteredPin: '',
                loginForm: { username: '', password: '' },
                newReport: { area: '', keterangan: '', rawFile: null, preview: '' },
                formNewUser: { username: '', password: '', role: 'user' },
                formChangePass: { username: '', newPassword: '' },

                init() {
                    this.fetchData();
                },

                getWIBDateStr() {
                    const options = { 
                        timeZone: 'Asia/Jakarta', 
                        day: 'numeric', 
                        month: 'short', 
                        year: 'numeric', 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: false
                    };
                    return new Intl.DateTimeFormat('id-ID', options).format(new Date()) + ' WIB';
                },

                fetchData() {
                    fetch(SCRIPT_URL + '?action=getAccounts')
                        .then(res => res.json())
                        .then(data => { this.accounts = data; })
                        .catch(err => console.error('Gagal memuat akun:', err));

                    fetch(SCRIPT_URL + '?action=getReports')
                        .then(res => res.json())
                        .then(data => { this.reports = data.reverse(); })
                        .catch(err => console.error('Gagal memuat laporan:', err));
                },

                login() {
                    this.loginError = '';
                    let found = this.accounts.find(acc => acc.username === this.loginForm.username && acc.password === this.loginForm.password);
                    if (found) {
                        this.role = found.role;
                        this.currentUser = found.username; // Menyimpan nama akun yang sedang masuk
                        this.page = 'dashboard';
                        this.activeTab = 'list';
                        this.loginForm = { username: '', password: '' };
                        this.fetchData();
                    } else {
                        this.loginError = 'Username atau password salah!';
                    }
                },

                logout() {
                    this.page = 'login';
                    this.role = '';
                    this.currentUser = ''; // Reset nama user saat logout
                    this.loginError = '';
                },

                openFullImage(imgSrc) {
                    this.activeImage = imgSrc;
                    this.showModalImage = true;
                },

                async uploadToImgBB(file) {
                    if (!file) return '';
                    const formData = new FormData();
                    formData.append('image', file);
                    
                    try {
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                            method: 'POST',
                            body: formData
                        });
                        const result = await response.json();
                        if (result.success) {
                            return result.data.url;
                        } else {
                            alert('Gagal mengunggah gambar ke server.');
                            return '';
                        }
                    } catch (error) {
                        console.error('ImgBB Error:', error);
                        alert('Terjadi kesalahan saat upload gambar.');
                        return '';
                    }
                },

                async submitReport() {
                    if(!this.newReport.area || !this.newReport.keterangan) return;
                    this.loading = true;
                    this.loadingText = 'Mengompres & Mengunggah foto...';

                    let photoUrl = 'https://images.unsplash.com/photo-1517673132405-a56a62b18caf?auto=format&fit=crop&w=500&q=80';
                    if (this.newReport.rawFile) {
                        photoUrl = await this.uploadToImgBB(this.newReport.rawFile);
                    }

                    this.loadingText = 'Menyimpan laporan ke database...';
                    const payload = {
                        action: 'addReport',
                        id: 'REP-' + Date.now(),
                        username: this.currentUser, // Mengirim nama user yang sedang login ke Spreadsheet
                        date: this.getWIBDateStr(),
                        area: this.newReport.area,
                        keterangan: this.newReport.keterangan,
                        foto: photoUrl,
                        status: 'Pending',
                        tindakLanjut: '',
                        dokTindakLanjut: ''
                    };

                    try {
                        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                        this.loading = false;
                        this.newReport = { area: '', keterangan: '', rawFile: null, preview: '' };
                        this.activeTab = 'list';
                        this.fetchData();
                    } catch (err) {
                        this.loading = false;
                        alert('Gagal mengirim laporan!');
                    }
                },

                async submitTindakLanjutWithImage(item, text, rawFile) {
                    if(!text) return;
                    this.loading = true;
                    this.loadingText = 'Mengompres & Mengunggah dokumentasi...';

                    let dokUrl = '';
                    if (rawFile) {
                        dokUrl = await this.uploadToImgBB(rawFile);
                    }

                    this.loadingText = 'Menyimpan tindak lanjut...';
                    const payload = {
                        action: 'updateReport',
                        id: item.id,
                        status: 'Selesai',
                        tindakLanjut: text,
                        dokTindakLanjut: dokUrl
                    };

                    try {
                        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                        this.loading = false;
                        this.fetchData();
                    } catch (err) {
                        this.loading = false;
                        alert('Gagal menyimpan tindak lanjut!');
                    }
                },

                deleteReport(item) {
                    if(confirm('Apakah Anda yakin ingin menghapus laporan ini?')) {
                        this.loading = true;
                        this.loadingText = 'Menghapus laporan...';
                        fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'deleteReport', id: item.id })
                        })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            this.fetchData();
                        })
                        .catch(err => {
                            this.loading = false;
                            alert('Gagal menghapus laporan!');
                        });
                    }
                },

                saveAndPrint(item) {
                    setTimeout(() => {
                        window.print();
                    }, 200);
                },

                addUser() {
                    if(this.enteredPin !== this.securityPin) {
                        alert('PIN Verifikasi salah!');
                        return;
                    }
                    this.loading = true;
                    this.loadingText = 'Menambahkan akun...';
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'addAccount', ...this.formNewUser })
                    })
                    .then(res => res.json())
                    .then(res => {
                        this.loading = false;
                        alert('Akun berhasil ditambahkan!');
                        this.formNewUser = { username: '', password: '', role: 'user' };
                        this.enteredPin = '';
                        this.settingsView = '';
                        this.fetchData();
                    })
                    .catch(err => {
                        this.loading = false;
                        alert('Gagal menambah akun!');
                    });
                },

                changePassword() {
                    if(this.enteredPin !== this.securityPin) {
                        alert('PIN Verifikasi salah!');
                        return;
                    }
                    this.loading = true;
                    this.loadingText = 'Mengubah password...';
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'changePassword', ...this.formChangePass })
                    })
                    .then(res => res.json())
                    .then(res => {
                        this.loading = false;
                        alert('Password berhasil diubah!');
                        this.formChangePass = { username: '', newPassword: '' };
                        this.enteredPin = '';
                        this.settingsView = '';
                        this.fetchData();
                    })
                    .catch(err => {
                        this.loading = false;
                        alert('Gagal mengubah password!');
                    });
                }
            }
        }
    </script>
</body>
</html>
