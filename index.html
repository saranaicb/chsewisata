<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring CHSE - SMK ICB Cinta Wisata</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area { position: absolute !important; left: 0 !important; top: 0 !important; width: 100% !important; background: white !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- Loading Indicator Sinkronisasi -->
    <div id="loading-sync" class="fixed inset-0 bg-slate-900/50 z-50 flex items-center justify-center text-white font-bold text-sm gap-2">
        <i class="fa-solid fa-spinner fa-spin text-xl"></i> Memuat data dari server...
    </div>

    <div id="app" class="min-h-screen flex flex-col justify-between">
        <!-- HALAMAN LOGIN -->
        <div id="login-page" class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900">
            <div class="bg-white w-full max-w-sm sm:max-w-md rounded-2xl shadow-2xl p-6 sm:p-8">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-28 h-28 bg-white rounded-full mb-3 shadow-md border-4 border-amber-400/80 p-1.5 overflow-hidden">
                        <img src="https://i.ibb.co.com/DHmRPRpZ/logo.png" alt="Logo CHSE" class="w-full h-full object-contain rounded-full" onerror="this.src='https://via.placeholder.com/150?text=CHSE+WISATA';">
                    </div>
                    <h1 class="text-xl font-black text-slate-900">TIM CHSE</h1>
                    <p class="text-xs text-slate-600">SMK ICB Cinta Wisata</p>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Username</label>
                        <input type="text" id="username" required class="w-full px-3.5 py-3 border rounded-xl text-sm bg-slate-50" placeholder="Username">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Password</label>
                        <input type="password" id="password" required class="w-full px-3.5 py-3 border rounded-xl text-sm bg-slate-50" placeholder="Password">
                    </div>
                    <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-xl text-sm shadow-lg">Masuk Sistem</button>
                </form>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-page" class="hidden flex-1 flex flex-col">
            <header class="bg-white border-b sticky top-0 z-50 no-print">
                <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center border border-amber-400 overflow-hidden">
                            <img src="https://i.ibb.co.com/DHmRPRpZ/logo.png" alt="Logo" class="w-full h-full object-contain">
                        </div>
                        <div>
                            <h2 class="font-bold text-sm text-slate-900">CHSE Wisata</h2>
                            <p class="text-[11px] text-slate-500">SMK ICB Cinta Wisata</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="exportData()" title="Simpan File Cadangan JSON" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> <span class="hidden md:inline">Save</span>
                        </button>
                        <button onclick="manualSync()" class="bg-emerald-50 text-emerald-700 text-xs font-semibold px-3 py-2 rounded-lg transition hover:bg-emerald-100" title="Sinkronisasi Data">
                            <i class="fa-solid fa-sync"></i> <span class="hidden md:inline">Refresh</span>
                        </button>
                        <button onclick="downloadPDF()" class="bg-blue-600 text-white text-xs font-semibold px-3 py-2 rounded-lg"><i class="fa-solid fa-file-pdf"></i> PDF</button>
                        <button onclick="window.print()" class="bg-slate-100 text-slate-700 text-xs font-semibold px-3 py-2 rounded-lg"><i class="fa-solid fa-print"></i> Cetak</button>
                        <span id="user-badge" class="px-2.5 py-1 bg-blue-100 text-blue-800 text-[11px] font-bold rounded-lg uppercase"></span>
                        <button onclick="logout()" class="text-slate-500 hover:text-red-600 px-2 py-1"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </div>
            </header>

            <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- FORM LAPORAN -->
                <div class="lg:col-span-1 space-y-6 no-print">
                    <div class="bg-white rounded-2xl shadow-sm border p-5 sticky top-20">
                        <h3 class="font-bold text-slate-900 mb-4 flex items-center"><i class="fa-solid fa-file-pen text-blue-600 mr-2"></i> Buat Laporan Baru</h3>
                        <form id="report-form" onsubmit="submitReport(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Area :</label>
                                <input type="text" id="report-area" required class="w-full px-3.5 py-2.5 border rounded-xl text-sm bg-slate-50" placeholder="Cth: Toilet Lantai 2">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Keterangan :</label>
                                <textarea id="report-desc" rows="3" required class="w-full px-3.5 py-2.5 border rounded-xl text-sm bg-slate-50" placeholder="Jelaskan temuan..."></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Upload Foto :</label>
                                <input type="file" id="report-photo" accept="image/*" class="w-full text-xs text-slate-500 border rounded-xl p-1 bg-slate-50">
                            </div>
                            <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm shadow">Kirim Laporan</button>
                        </form>
                    </div>
                </div>

                <!-- DAFTAR LAPORAN -->
                <div class="lg:col-span-2 space-y-4">
                    <div id="printable-area" class="bg-white rounded-2xl shadow-sm border p-5">
                        <div class="flex justify-between items-center mb-6 border-b pb-4">
                            <div>
                                <h3 class="font-black text-slate-900 text-base"><i class="fa-solid fa-clipboard-list text-blue-600 mr-2"></i> Daftar Laporan Area CHSE</h3>
                                <p class="text-xs text-slate-500">SMK ICB Cinta Wisata</p>
                            </div>
                            <span id="total-reports" class="bg-blue-50 text-blue-700 text-xs px-3 py-1.5 rounded-full font-bold">0 Laporan</span>
                        </div>
                        <div id="reports-container" class="space-y-4"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL FOTO -->
    <div id="photo-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-2xl max-w-lg w-full p-4 relative">
            <button onclick="closeModal('photo-modal')" class="absolute top-3 right-3 text-slate-400 font-bold"><i class="fa-solid fa-xmark"></i></button>
            <img id="modal-img-element" src="" class="w-full h-auto rounded-xl object-contain max-h-[70vh]">
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbw7KCd5_FSss2aN-0Ml6bt9Q8S0s-jkYa7Rmkzd22lIXVGciFjbVXn6VxwblK1swnXNMg/exec';
        const IMGBB_API_KEY = 'ff6b62f8524e82b7815501fb43d05353';

        let users = [];
        let reports = [];
        let currentUser = JSON.parse(localStorage.getItem('chse_current_user')) || null;

        window.addEventListener('DOMContentLoaded', () => {
            fetchDataFromServer(true).then(() => {
                if (currentUser) showDashboard();
            });

            // Sinkronisasi otomatis setiap 15 detik secara real-time
            setInterval(async () => {
                if (currentUser) {
                    await fetchDataFromServer(false);
                }
            }, 15000);
        });

        async function fetchDataFromServer(showLoader = false) {
            try {
                if (showLoader) document.getElementById('loading-sync').classList.remove('hidden');
                
                const res = await fetch(`${API_URL}?action=getData`);
                const data = await res.json();
                users = data.users || [];
                reports = data.reports || [];
                
                if (currentUser) {
                    renderReports();
                }
            } catch (err) {
                console.error("Gagal sinkronisasi data:", err);
            } finally {
                if (showLoader) document.getElementById('loading-sync').classList.add('hidden');
            }
        }

        async function manualSync() {
            await fetchDataFromServer(true);
            alert('Data berhasil disinkronkan dari server!');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reports, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_data_chse_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) return data.data.url;
            throw new Error('Gagal mengunggah gambar ke ImgBB');
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
            
            if (found) {
                currentUser = { username: found.username, role: found.role };
                localStorage.setItem('chse_current_user', JSON.stringify(currentUser));
                showDashboard();
            } else {
                alert('Username atau Password salah!');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('chse_current_user');
            document.getElementById('dashboard-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
        }

        function showDashboard() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');
            document.getElementById('user-badge').innerText = `${currentUser.role}: ${currentUser.username}`;
            renderReports();
        }

        async function submitReport(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Mengunggah...";
            btn.disabled = true;

            try {
                const area = document.getElementById('report-area').value;
                const keterangan = document.getElementById('report-desc').value;
                const photoInput = document.getElementById('report-photo');
                let photoUrl = "https://via.placeholder.com/400x300?text=Tidak+Ada+Foto";

                if (photoInput.files && photoInput.files[0]) {
                    photoUrl = await uploadToImgBB(photoInput.files[0]);
                }

                const reportData = {
                    action: 'saveReport',
                    id: Date.now(),
                    area: area,
                    keterangan: keterangan,
                    photo: photoUrl,
                    pelapor: currentUser.username,
                    tanggalLaporan: new Date().toLocaleDateString('id-ID')
                };

                const queryString = new URLSearchParams(reportData).toString();
                await fetch(`${API_URL}?${queryString}`, { method: 'GET' });

                document.getElementById('report-form').reset();
                alert('Laporan berhasil dikirim dan disinkronkan ke server!');
                await fetchDataFromServer(false);
            } catch (err) {
                alert('Gagal mengirim laporan: ' + err.message);
            } finally {
                btn.innerText = "Kirim Laporan";
                btn.disabled = false;
            }
        }

        function renderReports() {
            const container = document.getElementById('reports-container');
            document.getElementById('total-reports').innerText = `${reports.length} Laporan`;
            
            if (reports.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">Belum ada laporan masuk.</div>`;
                return;
            }

            container.innerHTML = reports.map(r => `
                <div class="border rounded-2xl p-4 bg-white space-y-3 shadow-xs">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-black text-blue-700 uppercase">Area : ${r.area}</span>
                            <p class="text-[11px] text-slate-400">Pelapor: ${r.pelapor} • ${r.tanggalLaporan}</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${r.status === 'Selesai' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${r.status || 'Menunggu Tindak Lanjut'}</span>
                    </div>
                    <div class="text-sm bg-slate-50 p-3 rounded-xl">${r.keterangan}</div>
                    <div>
                        <img src="${r.photo}" onclick="openPhotoModal('${r.photo}')" class="w-28 h-20 object-cover rounded-xl cursor-pointer border" crossorigin="anonymous">
                    </div>
                    <div class="border-t pt-3">
                        <span class="text-xs font-bold text-indigo-700 uppercase">Tindak Lanjut :</span>
                        ${r.tindakLanjut ? `<p class="text-sm bg-indigo-50 p-3 rounded-xl mt-1">${r.tindakLanjut}</p>` : `<p class="text-xs text-slate-400 italic mt-1">Belum ada tindak lanjut.</p>`}
                        ${currentUser.role === 'admin' && !r.tindakLanjut ? `
                            <form onsubmit="submitFollowUp(event, '${r.id}')" class="no-print mt-2 space-y-2">
                                <input type="text" id="tindak-${r.id}" placeholder="Tulis tindak lanjut..." required class="w-full px-3 py-1.5 border rounded-xl text-xs">
                                <input type="file" id="dok-${r.id}" accept="image/*" class="w-full text-xs">
                                <button type="submit" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold">Simpan</button>
                            </form>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function submitFollowUp(e, id) {
            e.preventDefault();
            const tindakLanjutText = document.getElementById(`tindak-${id}`).value;
            const dokInput = document.getElementById(`dok-${id}`);
            let dokUrl = "";

            if (dokInput.files && dokInput.files[0]) {
                dokUrl = await uploadToImgBB(dokInput.files[0]);
            }

            const followUpData = {
                action: 'updateFollowUp',
                id: id,
                tindakLanjut: tindakLanjutText,
                tanggalTindakLanjut: new Date().toLocaleDateString('id-ID'),
                dokumentasi: dokUrl
            };

            const queryString = new URLSearchParams(followUpData).toString();
            await fetch(`${API_URL}?${queryString}`, { method: 'GET' });

            alert('Tindak lanjut berhasil diperbarui dan disinkronkan!');
            await fetchDataFromServer(false);
        }

        function downloadPDF() {
            html2pdf().from(document.getElementById('printable-area')).save(`laporan_chse_${Date.now()}.pdf`);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function openPhotoModal(url) {
            document.getElementById('modal-img-element').src = url;
            document.getElementById('photo-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
